<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Nyx — systems, software, and agent tools</title>
  <desc id="desc">A violet and mint orbital network on a deep indigo field.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b14"/><stop offset="0.55" stop-color="#111326"/><stop offset="1" stop-color="#171022"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9063ff" stop-opacity="0.08"/><stop offset="0.48" stop-color="#d35bff" stop-opacity="0.8"/><stop offset="1" stop-color="#5de2ca" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4fa3"/><stop offset="1" stop-color="#89f0d7"/>
    </linearGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#f6c4ff"/><stop offset="0.32" stop-color="#cc6dff"/><stop offset="1" stop-color="#7336d2" stop-opacity="0.15"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#a7a2ce" stroke-opacity="0.1" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <ellipse cx="976" cy="179" rx="178" ry="127" fill="#a73df0" opacity="0.18" filter="url(#glow)"/>
  <ellipse cx="1038" cy="194" rx="120" ry="90" fill="#ff3f9d" opacity="0.12" filter="url(#glow)"/>
  <g fill="none" stroke="url(#orbit)">
    <ellipse cx="965" cy="180" rx="198" ry="70" transform="rotate(-24 965 180)" stroke-width="1.5"/>
    <ellipse cx="965" cy="180" rx="166" ry="104" transform="rotate(32 965 180)" stroke-width="1.2"/>
    <ellipse cx="965" cy="180" rx="128" ry="128" transform="rotate(71 965 180)" stroke-width="1" stroke-dasharray="4 8"/>
    <path d="M770 239C825 113 883 96 939 173S1040 261 1166 91" stroke-width="1.4"/>
  </g>
  <g fill="url(#spark)">
    <circle cx="790" cy="226" r="4"/><circle cx="855" cy="116" r="3"/>
    <circle cx="1080" cy="125" r="4"/><circle cx="1153" cy="108" r="3"/>
    <circle cx="1058" cy="274" r="3"/><circle cx="890" cy="275" r="2.5"/>
  </g>
  <circle cx="965" cy="180" r="67" fill="#d74dff" opacity="0.22" filter="url(#glow)"/>
  <circle cx="965" cy="180" r="43" fill="#111324" stroke="url(#spark)" stroke-width="1.5"/>
  <path d="M965 151l8 20 20 9-20 8-8 21-8-21-20-8 20-9z" fill="url(#spark)"/>
  <circle cx="965" cy="180" r="4" fill="#fff4ff"/>
  <text x="78" y="132" fill="#f4f1ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="74" font-weight="700" letter-spacing="10">NYX</text>
  <text x="84" y="179" fill="#9fe8d8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" letter-spacing="4">SYSTEMS · SOFTWARE · AGENT TOOLS</text>
  <path d="M84 208H493" stroke="url(#orbit)" stroke-width="1.4"/>
  <text x="84" y="251" fill="#d7d7e6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">Turning recurring friction into useful software.</text>
  <text x="84" y="290" fill="#8f92a9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" letter-spacing="1.4">PROJECT COMPANION · EDGE-CASE WRANGLER</text>
</svg>
